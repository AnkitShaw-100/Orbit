<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Orbit">
  <!--
    Orbit's mark: the ring and its centre, the same shape the sidebar and the
    landing nav draw. On a dark plate rather than transparent, so the gold
    reads at 16px against a light browser tab as well as a dark one.

    The colours are the literal token values from src/index.css. An SVG served
    from /public is a static file, so it cannot reference CSS variables; if the
    ink or brand token changes, change it here too.
  -->
  <rect width="32" height="32" rx="7" fill="#0A0A0A" />
  <circle cx="16" cy="16" r="9.25" fill="none" stroke="#E3A72F" stroke-width="2.25" />
  <circle cx="16" cy="16" r="4" fill="#E3A72F" />
</svg>
