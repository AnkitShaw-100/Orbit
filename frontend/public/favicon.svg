<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Orbit">
  <!--
    Orbit's mark: the ring and its centre, the same shape the sidebar and the
    landing nav draw. The geometry is identical to src/components/OrbitMark.jsx
    — a static file served from /public cannot import the component, so the two
    are kept in step by hand. Change one, change the other.

    On a dark plate rather than transparent, so the gold reads at 16px against
    a light browser tab as well as a dark one. The colours are the literal
    token values from src/index.css (--color-ink, --color-brand); if either
    token changes, change it here too.
  -->
  <rect width="32" height="32" rx="7" fill="#0A0A0A" />

  <!-- The mark fills its own 32-unit grid; on a plate it needs a margin, so
       the whole thing is scaled about the centre. The stroke scales with it,
       landing at the same weight the plate carried before. -->
  <g transform="translate(3.2 3.2) scale(0.8)">
    <circle cx="16" cy="16" r="13" fill="none" stroke="#E3A72F" stroke-width="2.6" />
    <circle cx="16" cy="16" r="3.4" fill="#E3A72F" />
  </g>
</svg>
